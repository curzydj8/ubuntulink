<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UbuntuLink · 机器信息</title>
<style>
  :root {
    --bg: #0d1017;
    --card: #161b26;
    --card-border: #232a3a;
    --text: #e6eaf2;
    --muted: #8b94a7;
    --accent: #4ade80;
    --accent-blue: #60a5fa;
    --accent-amber: #fbbf24;
    --accent-red: #f87171;
    --bar-bg: #232a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  h1 { font-size: 1.4rem; font-weight: 700; }
  h1 .dot { color: var(--accent); }
  .meta { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
  #conn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
  }
  #conn.ok { background: rgba(74,222,128,.12); color: var(--accent); }
  #conn.bad { background: rgba(248,113,113,.12); color: var(--accent-red); }
  #conn .pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  #conn.ok .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
  }
  .card.wide { grid-column: 1 / -1; }
  .card h2 {
    font-size: 0.85rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;
  }
  .big { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .big small { font-size: 0.9rem; font-weight: 400; color: var(--muted); }
  .sub { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
  .bar { height: 8px; background: var(--bar-bg); border-radius: 999px; margin-top: 10px; overflow: hidden; }
  .bar > div {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent));
    transition: width .5s ease;
  }
  .bar.warn > div { background: linear-gradient(90deg, var(--accent-amber), #f97316); }
  .bar.crit > div { background: linear-gradient(90deg, #f97316, var(--accent-red)); }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--card-border); }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--muted); font-size: 0.9rem; }
  .row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .na { color: var(--muted); font-style: normal; }
  canvas#cpuChart { width: 100%; height: 160px; display: block; }
  .chart-legend { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 20px; }
  @media (max-width: 480px) {
    body { padding: 10px; }
    .big { font-size: 1.6rem; }
    h1 { font-size: 1.15rem; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="dot">●</span> UbuntuLink 机器信息</h1>
  <div class="meta">
    <span id="conn" class="bad"><span class="pulse"></span><span id="connText">连接中…</span></span>
    <span>更新于 <span id="updatedAt">—</span></span>
  </div>
</header>

<main class="grid">
  <section class="card wide">
    <h2>CPU 使用率历史（最近 2 分钟）</h2>
    <canvas id="cpuChart"></canvas>
    <div class="chart-legend"><span>60 个采样点 · 每 2 秒</span><span id="chartNow">—</span></div>
  </section>

  <section class="card">
    <h2>CPU</h2>
    <div class="big"><span id="cpuUsage">—</span><small> %</small></div>
    <div class="bar" id="cpuBar"><div style="width:0%"></div></div>
    <div class="sub" id="cpuInfo">—</div>
  </section>

  <section class="card">
    <h2>内存</h2>
    <div class="big"><span id="memUsage">—</span><small> %</small></div>
    <div class="bar" id="memBar"><div style="width:0%"></div></div>
    <div class="sub" id="memInfo">—</div>
  </section>

  <section class="card">
    <h2>磁盘 <span id="diskPath" style="text-transform:none"></span></h2>
    <div class="big"><span id="diskUsage">—</span><small> %</small></div>
    <div class="bar" id="diskBar"><div style="width:0%"></div></div>
    <div class="sub" id="diskInfo">—</div>
  </section>

  <section class="card">
    <h2>网络</h2>
    <div id="netList"><div class="sub">—</div></div>
  </section>

  <section class="card">
    <h2>温度</h2>
    <div id="tempList"><div class="sub">—</div></div>
  </section>
</main>

<footer>UbuntuLink Agent · 只读监控 · 每 2 秒刷新</footer>

<script>
(function () {
  "use strict";
  var NA = '<span class="na">不可用</span>';
  var history = [];           // CPU 历史，最多 60 点
  var HISTORY_MAX = 60;
  var failCount = 0;

  var $ = function (id) { return document.getElementById(id); };

  // 安全取值：缺失/非数字 → null
  function num(v) {
    if (v === null || v === undefined || v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function fmt(v, digits) {
    var n = num(v);
    return n === null ? null : n.toFixed(digits === undefined ? 1 : digits);
  }
  function setBar(id, pct) {
    var bar = $(id);
    var inner = bar.firstElementChild;
    var n = num(pct);
    inner.style.width = n === null ? "0%" : Math.min(100, Math.max(0, n)) + "%";
    bar.classList.remove("warn", "crit");
    if (n !== null) {
      if (n >= 90) bar.classList.add("crit");
      else if (n >= 70) bar.classList.add("warn");
    }
  }

  function setConn(ok) {
    var c = $("conn"), t = $("connText");
    if (ok) {
      c.className = "ok"; t.textContent = "已连接";
    } else {
      c.className = "bad"; t.textContent = "连接断开 · 重试中";
    }
  }

  function render(d) {
    // ---- CPU ----
    var cpu = d.cpu || {};
    var usage = fmt(cpu.usage_percent);
    $("cpuUsage").innerHTML = usage === null ? NA : usage;
    setBar("cpuBar", cpu.usage_percent);
    var cores = num(cpu.cores), freq = fmt(cpu.freq_mhz, 0);
    var info = [];
    if (cores !== null) info.push(cores + " 核");
    if (freq !== null) info.push(freq + " MHz");
    $("cpuInfo").textContent = info.length ? info.join(" · ") : "—";
    $("chartNow").textContent = usage === null ? "当前：不可用" : "当前：" + usage + " %";

    if (usage !== null) {
      history.push(Number(usage));
      if (history.length > HISTORY_MAX) history.shift();
    }
    drawChart();

    // ---- 内存 ----
    var mem = d.memory || {};
    var mPct = fmt(mem.used_percent);
    $("memUsage").innerHTML = mPct === null ? NA : mPct;
    setBar("memBar", mem.used_percent);
    var total = num(mem.total_mb), avail = num(mem.available_mb);
    if (total !== null && avail !== null) {
      var used = total - avail;
      $("memInfo").textContent = "已用 " + (used / 1024).toFixed(1) + " GB / 共 " + (total / 1024).toFixed(1) + " GB";
    } else if (total !== null) {
      $("memInfo").textContent = "共 " + (total / 1024).toFixed(1) + " GB";
    } else {
      $("memInfo").textContent = "—";
    }

    // ---- 磁盘 ----
    var disk = d.disk || {};
    var dPct = fmt(disk.used_percent);
    $("diskUsage").innerHTML = dPct === null ? NA : dPct;
    setBar("diskBar", disk.used_percent);
    $("diskPath").textContent = disk.path ? "(" + disk.path + ")" : "";
    var du = num(disk.used_gb), dt = num(disk.total_gb);
    $("diskInfo").textContent = (du !== null && dt !== null)
      ? "已用 " + du.toFixed(1) + " GB / 共 " + dt.toFixed(1) + " GB" : "—";

    // ---- 网络 ----
    var nets = Array.isArray(d.network) ? d.network : [];
    if (!nets.length) {
      $("netList").innerHTML = '<div class="sub">不可用</div>';
    } else {
      $("netList").innerHTML = nets.map(function (n) {
        var name = n.iface || n.name || "?";
        var rx = fmt(n.rx_kbps), tx = fmt(n.tx_kbps);
        return '<div class="row"><span class="k">' + esc(name) + '</span>' +
          '<span class="v">↓ ' + (rx === null ? "?" : rx) + ' KB/s · ↑ ' + (tx === null ? "?" : tx) + " KB/s</span></div>";
      }).join("");
    }

    // ---- 温度 ----
    var temps = Array.isArray(d.temperature) ? d.temperature : [];
    if (!temps.length) {
      $("tempList").innerHTML = '<div class="sub">不可用</div>';
    } else {
      $("tempList").innerHTML = temps.map(function (t) {
        var label = t.label || t.name || "?";
        var c = fmt(t.celsius);
        return '<div class="row"><span class="k">' + esc(label) + '</span>' +
          '<span class="v">' + (c === null ? "不可用" : c + " °C") + "</span></div>";
      }).join("");
    }

    var now = new Date();
    $("updatedAt").textContent = now.toLocaleTimeString("zh-CN", { hour12: false });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  // ---- Canvas 折线图 ----
  var canvas = $("cpuChart");
  function drawChart() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
      canvas.width = w * dpr; canvas.height = h * dpr;
    }
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var padL = 34, padR = 8, padT = 8, padB = 18;
    var iw = w - padL - padR, ih = h - padT - padB;

    // 网格 + Y 轴标签
    ctx.font = "10px sans-serif";
    ctx.fillStyle = "#5b6478";
    ctx.strokeStyle = "#232a3a";
    ctx.lineWidth = 1;
    [0, 25, 50, 75, 100].forEach(function (v) {
      var y = padT + ih - (v / 100) * ih;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      ctx.fillText(v + "%", 4, y + 3);
    });

    if (history.length < 2) {
      ctx.fillStyle = "#5b6478";
      ctx.fillText("等待数据…", padL + 8, padT + 16);
      return;
    }

    var n = history.length;
    var x = function (i) { return padL + (i / (HISTORY_MAX - 1)) * iw; };
    var y = function (v) { return padT + ih - (Math.min(100, Math.max(0, v)) / 100) * ih; };
    // 右对齐：最新数据在右端
    var x2 = function (i) { return padL + iw - ((n - 1 - i) / (HISTORY_MAX - 1)) * iw; };

    // 渐变填充
    var grad = ctx.createLinearGradient(0, padT, 0, padT + ih);
    grad.addColorStop(0, "rgba(96,165,250,.35)");
    grad.addColorStop(1, "rgba(96,165,250,0)");
    ctx.beginPath();
    ctx.moveTo(x2(0), y(history[0]));
    for (var i = 1; i < n; i++) ctx.lineTo(x2(i), y(history[i]));
    ctx.lineTo(x2(n - 1), padT + ih);
    ctx.lineTo(x2(0), padT + ih);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // 折线
    ctx.beginPath();
    ctx.moveTo(x2(0), y(history[0]));
    for (var j = 1; j < n; j++) ctx.lineTo(x2(j), y(history[j]));
    ctx.strokeStyle = "#60a5fa";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.stroke();

    // 最新点
    ctx.beginPath();
    ctx.arc(x2(n - 1), y(history[n - 1]), 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "#4ade80";
    ctx.fill();

    // X 轴时间标签
    ctx.fillStyle = "#5b6478";
    ctx.fillText("-2 分钟", padL, h - 4);
    ctx.fillText("现在", w - padR - 24, h - 4);
  }

  function tick() {
    fetch("/api/v1/dashboard/metrics", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        failCount = 0;
        setConn(true);
        render(d || {});
      })
      .catch(function () {
        failCount++;
        setConn(false);
        // 失败也重画一次（保持旧曲线可见）
        drawChart();
      });
  }

  window.addEventListener("resize", drawChart);
  tick();
  setInterval(tick, 2000);
})();
</script>
</body>
</html>
